<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050A12;--panel:#0A1622;--ink:#D7F3FF;--mute:#6E8CA3;--line:#1C3A52;--cyan:#19E3FF;--amber:#FFB020;--red:#FF4B3E;--lime:#7CFF6B;--on:#02121A;--grid:rgba(25,227,255,.06);--glow:rgba(25,227,255,.14)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#E6EEF3;--panel:#F6FAFC;--ink:#0B2233;--mute:#52697B;--line:#B4C8D6;--cyan:#0090B8;--amber:#C77700;--red:#C8281C;--lime:#2E9E2A;--on:#fff;--grid:rgba(0,100,140,.08);--glow:rgba(0,144,184,.12)}}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100%;color:var(--ink);font-family:Rajdhani,system-ui,sans-serif;font-weight:500;font-size:1.05rem;line-height:1.35;overflow-x:hidden;background:radial-gradient(ellipse at 50% 0,var(--glow),transparent 60%),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/40px 40px,var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);opacity:.5;z-index:5}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);font:700 .8rem Orbitron,sans-serif;letter-spacing:.18em;color:var(--mute)}
.top .sp{flex:1}.top #clk{color:var(--cyan)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
main{max-width:800px;margin:0 auto;padding:28px 16px 56px}
h1{font:900 clamp(1.9rem,8vw,3.4rem)/1 Orbitron,sans-serif;letter-spacing:.06em;margin:0 0 6px;color:var(--cyan);text-shadow:0 0 18px var(--glow),0 0 2px var(--cyan);animation:boot .9s steps(1) 1}
@keyframes boot{0%{opacity:0}10%{opacity:1}18%{opacity:.1}26%{opacity:1}34%{opacity:.4}42%,100%{opacity:1}}
.tag{margin:0 0 22px;color:var(--amber);font:700 .8rem Orbitron,sans-serif;letter-spacing:.22em}
.sub{margin:0;color:var(--mute);font-weight:600;letter-spacing:.04em}
.summary{display:flex;align-items:center;gap:20px;margin:0 0 14px}
.summary .big{position:relative;isolation:isolate;width:108px;height:108px;border-radius:50%;display:grid;place-items:center;flex:none;font:900 1.5rem Orbitron,sans-serif;color:var(--cyan);background:conic-gradient(var(--cyan) var(--pv,0%),var(--line) 0);box-shadow:0 0 28px var(--glow)}
.summary .big::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg);z-index:-1;box-shadow:inset 0 0 0 1px var(--line)}
.summary .sub{font-size:1.15rem}
.bar{height:10px;background:repeating-linear-gradient(90deg,var(--line) 0 12px,transparent 12px 15px);margin-top:4px;position:relative}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--cyan) 0 12px,transparent 12px 15px);transition:width .4s}
.nav{display:flex;align-items:center;gap:8px;margin:26px 0 12px;flex-wrap:wrap}
.nav b{font:700 .95rem Orbitron,sans-serif;letter-spacing:.14em;flex:1;min-width:150px;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.nb,.add button{background:transparent;color:var(--cyan);border:0;padding:8px 16px;font:700 .85rem Orbitron,sans-serif;letter-spacing:.12em;text-transform:uppercase;box-shadow:inset 0 0 0 1px var(--cyan);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:background .12s,color .12s}
.nb:hover,.add button:hover{background:var(--cyan);color:var(--on)}
.nb:focus-visible,.cell:focus-visible,.add button:focus-visible,input:focus-visible,.del:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.board{background:linear-gradient(180deg,var(--glow),transparent 40%),var(--panel);border:1px solid var(--line);box-shadow:inset 0 0 40px var(--glow);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));overflow-x:auto}
.row{display:grid;grid-template-columns:minmax(120px,1fr) repeat(7,44px) 72px;align-items:center;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);min-width:540px}
.row:last-child{border-bottom:0}
.head{padding-top:12px;padding-bottom:8px;font:700 .72rem Orbitron,sans-serif;letter-spacing:.1em;text-align:center;color:var(--mute)}
.head .d{display:block}
.head.t{color:var(--cyan)}
.head.t .n{display:inline-block;background:var(--cyan);color:var(--on);padding:0 7px;margin-top:2px;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
.name{font:700 1.1rem/1.1 Rajdhani,sans-serif;letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.name::before{content:"";width:3px;height:1.2em;background:var(--amber);box-shadow:0 0 8px var(--amber);flex:none}
.del{background:none;border:0;color:var(--mute);padding:2px 6px;font-size:1.2rem}
.del:hover{color:var(--red)}
.cell{width:40px;height:40px;background:var(--bg);display:grid;place-items:center;font-size:1.1rem;color:var(--on);box-shadow:inset 0 0 0 2px var(--line);clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);border:0;transition:background .1s,box-shadow .1s}
.cell:hover:not(.fut){box-shadow:inset 0 0 0 2px var(--cyan)}
.cell.on{background:linear-gradient(135deg,var(--cyan),color-mix(in srgb,var(--cyan) 55%,#000));box-shadow:inset 0 0 12px rgba(255,255,255,.35)}
.row:nth-child(4n+3) .cell.on{background:linear-gradient(135deg,var(--amber),color-mix(in srgb,var(--amber) 55%,#000))}
.row:nth-child(4n+4) .cell.on{background:linear-gradient(135deg,var(--red),color-mix(in srgb,var(--red) 55%,#000))}
.row:nth-child(4n+5) .cell.on{background:linear-gradient(135deg,var(--lime),color-mix(in srgb,var(--lime) 55%,#000))}
.cell.fut{opacity:.3;cursor:default}
.streak{text-align:right;font:700 .8rem Orbitron,sans-serif;letter-spacing:.06em;color:var(--mute)}
.streak.hot{color:var(--amber)}
.streak.hot::before{content:"▲ "}
.empty{padding:34px 16px;text-align:center;color:var(--mute);font:700 .9rem Orbitron,sans-serif;letter-spacing:.14em}
.add{display:flex;gap:10px;margin-top:22px}
.add input{flex:1;min-width:0;font:600 1.05rem Rajdhani,sans-serif;letter-spacing:.05em;color:var(--ink);background:var(--panel);border:0;border-bottom:2px solid var(--cyan);padding:10px 12px;border-radius:0}
.add input::placeholder{color:var(--mute)}
.add button{background:var(--cyan);color:var(--on)}
.add button:hover{filter:brightness(1.2)}
.cf{position:fixed;width:16px;height:3px;background:#fff;box-shadow:0 0 8px var(--c,#19E3FF);pointer-events:none;z-index:9;animation:fly .6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}
@media (max-width:600px){
main{padding:20px 14px 40px}
.row{grid-template-columns:repeat(7,1fr);min-width:0;row-gap:8px;padding:12px 10px}
.row.head{padding:10px 10px 6px}
.row.head>span:first-child,.row.head>span:last-child{display:none}
.name{grid-column:1/6;grid-row:1}
.streak{grid-column:6/8;grid-row:1}
.cell{width:100%;max-width:46px;height:auto;aspect-ratio:1;justify-self:center}
.del{padding:8px 10px}
.add{flex-direction:column}
.add button{padding:14px}
.nav b{flex-basis:100%;order:-1}
}
</style>
</head>
<body>
<div class="top" aria-hidden="true"><span class="dot"></span>SYSTEM ONLINE<span class="sp"></span><span id="clk"></span></div>
<main>
  <h1>HABIT TRACKER</h1>
  <p class="tag">DAILY OPS // STATUS ACTIVE</p>
  <p class="sub">Tap a node to log the day.</p>
  <div class="summary"><span class="big" id="pct">0%</span><span id="cnt" class="sub" style="margin:0"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="nav" style="margin-top:20px">
    <button class="nb" id="prev" aria-label="Previous week">Prev</button>
    <b id="range"></b>
    <button class="nb" id="today">This week</button>
    <button class="nb" id="next" aria-label="Next week">Next</button>
  </div>
  <div class="board" id="board"></div>
  <div class="add">
    <input id="newName" placeholder="New habit, like “Read 20 minutes”" maxlength="60" aria-label="New habit name">
    <button id="addBtn">Add habit</button>
  </div>
</main>
<script>
(function(){
var KEY="habit-tracker-v1",S={habits:[],off:0};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.habits))S.habits=p.habits}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({habits:S.habits}))}catch(e){}}
function k(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return s.replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function weekStart(){var d=today();var dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow+S.off*7);return d}
function streak(h){var d=today();if(!h.done[k(d)])d.setDate(d.getDate()-1);var n=0;while(h.done[k(d)]){n++;d.setDate(d.getDate()-1)}return n}
var DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function render(){
  var ws=weekStart(),days=[],t=k(today()),i;
  for(i=0;i<7;i++){var d=new Date(ws);d.setDate(ws.getDate()+i);days.push(d)}
  var e=days[6];
  document.getElementById("range").textContent=MN[ws.getMonth()]+" "+ws.getDate()+" – "+MN[e.getMonth()]+" "+e.getDate();
  var h='<div class="row head"><span></span>';
  days.forEach(function(d){var is=k(d)===t;h+='<span class="head'+(is?" t":"")+'"><span class="d">'+DN[(d.getDay()+6)%7]+'</span><span class="n">'+d.getDate()+'</span></span>'});
  h+='<span class="head">Streak</span></div>';
  if(!S.habits.length)h+='<div class="empty">No habits yet. Add your first one below.</div>';
  var done=0,total=0;
  S.habits.forEach(function(hb){
    h+='<div class="row"><span class="name">'+esc(hb.name)+'<button class="del" data-del="'+hb.id+'" aria-label="Delete '+esc(hb.name)+'">×</button></span>';
    days.forEach(function(d){
      var key=k(d),on=!!hb.done[key],fut=key>t;
      if(!fut){total++;if(on)done++}
      h+='<button class="cell'+(on?" on":"")+(fut?" fut":"")+'" data-h="'+hb.id+'" data-d="'+key+'"'+(fut?" disabled":"")+' aria-pressed="'+on+'" aria-label="'+esc(hb.name)+', '+key+'">'+(on?"◆":"")+'</button>';
    });
    var s=streak(hb);
    h+='<span class="streak'+(s>1?" hot":"")+'">'+s+(s===1?" day":" days")+'</span></div>';
  });
  document.getElementById("board").innerHTML=h;
  var pct=total?Math.round(done/total*100):0;
  document.getElementById("pct").textContent=pct+"%";
  document.getElementById("cnt").textContent=total?done+" of "+total+" check-ins done this week":"Add a habit to start";
  document.getElementById("fill").style.width=pct+"%";document.getElementById("pct").style.setProperty("--pv",pct+"%");
}
function burst(el){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=["#19E3FF","#FFB020","#FFFFFF","#FF4B3E"];for(var i=0;i<16;i++){var n=document.createElement("i"),a=Math.random()*6.28,d=45+Math.random()*70;n.className="cf";n.style.cssText="left:"+cx+"px;top:"+cy+"px;--c:"+cols[i%4]+";rotate:"+a+"rad;--dx:"+Math.cos(a)*d+"px;--dy:"+Math.sin(a)*d+"px";document.body.appendChild(n);setTimeout(function(m){return function(){m.remove()}}(n),700)}}
document.getElementById("board").addEventListener("click",function(ev){
  var c=ev.target.closest("[data-h]"),x=ev.target.closest("[data-del]");
  if(c&&!c.disabled){var hb=S.habits.filter(function(z){return z.id===c.dataset.h})[0];if(hb){if(hb.done[c.dataset.d])delete hb.done[c.dataset.d];else{hb.done[c.dataset.d]=1;burst(c)}save();render()}}
  else if(x){var hb2=S.habits.filter(function(z){return z.id===x.dataset.del})[0];if(hb2&&confirm("Delete “"+hb2.name+"” and its history?")){S.habits=S.habits.filter(function(z){return z!==hb2});save();render()}}
});
function add(){var el=document.getElementById("newName"),v=el.value.trim();if(!v)return;S.habits.push({id:"h"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:v,done:{}});el.value="";save();render()}
document.getElementById("addBtn").addEventListener("click",add);
document.getElementById("newName").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
document.getElementById("prev").addEventListener("click",function(){S.off--;render()});
document.getElementById("next").addEventListener("click",function(){S.off++;render()});
document.getElementById("today").addEventListener("click",function(){S.off=0;render()});
function tick(){document.getElementById("clk").textContent=new Date().toLocaleTimeString([],{hour12:false})}tick();setInterval(tick,1000);
render();
})();
</script>
</body>
</html>
